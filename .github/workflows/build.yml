name: Build and Push
on:
  push:
    branches: [main]
    paths:
      - 'nodejs/**'
      - 'turn2socks/**'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate index.js
        run: |
          javascript-obfuscator nodejs/index.js \
            --output index.obf.js \
            --compact true \
            --self-defending true \
            --identifier-names-generator hexadecimal \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 0.75 \
            --string-array-rotate true \
            --string-array-shuffle true \
            --split-strings true \
            --split-strings-chunk-length 10 \
            --transform-object-keys true \
            --dead-code-injection false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build turn2socks binaries
        run: |
          cd turn2socks
          go vet ./...
          go test -count=1 ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o ../turn2socks-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o ../turn2socks-linux-arm64 .
          cd ..
          sha256sum turn2socks-linux-amd64 > turn2socks-linux-amd64.sha256
          sha256sum turn2socks-linux-arm64 > turn2socks-linux-arm64.sha256

      - name: Package release files
        run: |
          mkdir -p release
          cp index.obf.js release/index.js
          cp nodejs/package.json release/package.json
          cp nodejs/index.html   release/index.html
          cd release && zip -r ../xray.zip .

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          make_latest: true
          files: |
            xray.zip
            turn2socks-linux-amd64
            turn2socks-linux-amd64.sha256
            turn2socks-linux-arm64
            turn2socks-linux-arm64.sha256
          body: |
            ## Xray Universal Proxy Engine
            - `xray.zip`: PaaS 容器/平台部署包（包含已混淆的 Node.js 核心引擎 index.js、package.json 与伪装网页 index.html）
            - `turn2socks-linux-*`: 官方内置配套 TURN 智能中继转接组件（支持 amd64/arm64，附带 `.sha256` 完整性校验）

  docker:
    name: Multi-Arch Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xray:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
